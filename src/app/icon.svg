<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F5C518" />
      <stop offset="100%" stop-color="#B38B00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F5C518" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep dark background -->
  <rect width="256" height="256" rx="60" fill="#0A0A0A" />

  <!-- Film strip accent edge left -->
  <rect x="20" y="20" width="16" height="216" rx="4" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="12 12" />
  <!-- Film strip accent edge right -->
  <rect x="220" y="20" width="16" height="216" rx="4" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="12 12" />

  <!-- The main 'M' with glowing gradient -->
  <path d="M72 176 V80 L128 136 L184 80 V176" stroke="url(#gold)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)" />
</svg>
